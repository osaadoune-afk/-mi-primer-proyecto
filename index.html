<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Curso interactivo de desarrollo web y automatización con práctica guiada">
    <title>Curso Interactivo saadoune ia</title>
    
    <!-- Librerías Externas (CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --border: #334155;
            --code-bg: #090d16;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Estilos para Modo Claro */
        body.light-mode {
            --bg-primary: #f8fafc;
            --bg-secondary: #e2e8f0;
            --bg-tertiary: #cbd5e1;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border: #cbd5e1;
            --code-bg: #f1f5f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- Sidebar --- */
        #sidebar {
            width: 320px;
            background-color: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 10;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            position: relative;
        }

        .sidebar-header h1 {
            font-size: 1.2rem;
            color: var(--accent);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.2rem;
            transition: var(--transition);
        }

        .theme-toggle:hover {
            color: var(--accent);
            transform: rotate(180deg);
        }

        .progress-container {
            margin-top: 10px;
        }

        .progress-bar-container {
            background-color: var(--bg-primary);
            border-radius: 8px;
            height: 12px;
            width: 100%;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            background: linear-gradient(90deg, var(--accent) 0%, var(--success) 100%);
            height: 100%;
            width: 0%;
            transition: width 0.5s ease;
            position: relative;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .progress-text {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 5px;
            display: flex;
            justify-content: space-between;
        }

        .controls {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border-bottom: 1px solid var(--border);
        }

        .search-container {
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px 12px 12px 40px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: var(--bg-primary);
            color: var(--text-main);
            outline: none;
            transition: var(--transition);
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.1);
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background-color: var(--accent);
            color: var(--bg-primary);
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .btn-secondary {
            background-color: var(--bg-tertiary);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background-color: var(--border);
        }

        .day-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
            padding: 10px;
        }

        .day-item {
            padding: 15px;
            border-radius: 8px;
            border: 1px solid transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: var(--transition);
            margin-bottom: 8px;
            position: relative;
        }

        .day-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background-color: var(--accent);
            transform: scaleY(0);
            transition: transform 0.3s ease;
        }

        .day-item:hover {
            background-color: rgba(56, 189, 248, 0.1);
            border-color: var(--accent);
        }

        .day-item:hover::before {
            transform: scaleY(1);
        }

        .day-item.active {
            background-color: rgba(56, 189, 248, 0.2);
            border-color: var(--accent);
        }

        .day-item.active::before {
            transform: scaleY(1);
        }

        .day-item.completed {
            opacity: 0.8;
        }

        .day-item.completed span {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .day-item .checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .day-item .day-info {
            flex: 1;
        }

        .day-item .day-number {
            font-weight: 600;
            color: var(--accent);
        }

        .day-item .day-title {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* --- Main Content --- */
        #main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .content-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .day-title {
            font-size: 1.8rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 10px 15px;
            border-radius: 8px;
            transition: var(--transition);
        }

        .checkbox-container:hover {
            background-color: rgba(56, 189, 248, 0.1);
        }

        .section-title {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-top: 25px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .concept-box {
            background-color: var(--bg-primary);
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid var(--accent);
            margin-bottom: 20px;
        }

        .concept-box p {
            line-height: 1.6;
            color: var(--text-main);
        }

        .code-container {
            position: relative;
            margin-bottom: 20px;
        }

        .copy-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: var(--bg-tertiary);
            border: none;
            color: var(--text-muted);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .copy-btn:hover {
            background-color: var(--accent);
            color: var(--bg-primary);
        }

        pre {
            background-color: var(--code-bg);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
            overflow-x: auto;
            color: #e2e8f0;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .exercise-box {
            background-color: var(--bg-primary);
            padding: 20px;
            border-radius: 8px;
            border: 1px dashed var(--border);
            margin-bottom: 20px;
        }

        .quiz-container {
            background-color: var(--bg-primary);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .quiz-option {
            background-color: var(--bg-secondary);
            border: 2px solid var(--border);
            padding: 15px;
            border-radius: 8px;
            margin-top: 12px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .quiz-option::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background-color: var(--accent);
            transform: scaleY(0);
            transition: transform 0.3s ease;
        }

        .quiz-option:hover {
            border-color: var(--accent);
            transform: translateX(5px);
        }

        .quiz-option:hover::before {
            transform: scaleY(1);
        }

        .quiz-option.selected {
            border-color: var(--accent);
            background-color: rgba(56, 189, 248, 0.1);
        }

        .quiz-option.correct {
            border-color: var(--success);
            background-color: rgba(34, 197, 94, 0.1);
        }

        .quiz-option.incorrect {
            border-color: var(--danger);
            background-color: rgba(239, 68, 68, 0.1);
        }

        .feedback {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            font-weight: 500;
            display: none;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .feedback.correct {
            background-color: rgba(34, 197, 94, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
            display: block;
        }

        .feedback.incorrect {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
            display: block;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: var(--bg-tertiary);
            color: var(--text-main);
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: var(--shadow);
            transform: translateY(100px);
            opacity: 0;
            transition: var(--transition);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success { border-left: 4px solid var(--success); }
        .toast.error { border-left: 4px solid var(--danger); }

        /* Responsive */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            #sidebar { width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--border); }
            .day-list { display: flex; flex-wrap: wrap; gap: 10px; padding: 10px; }
            .day-item { width: calc(50% - 5px); margin-bottom: 0; }
            #main-content { padding: 20px; }
            .day-header { flex-direction: column; align-items: flex-start; }
            .btn-group { flex-direction: column; width: 100%; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside id="sidebar" role="navigation" aria-label="Menú de navegación">
        <div class="sidebar-header">
            <h1><i class="fas fa-code"></i> Desarrollo Web & Automatización</h1>
            <button class="theme-toggle" onclick="toggleTheme()" aria-label="Cambiar tema">
                <i class="fas fa-moon" id="theme-icon"></i>
            </button>
            
            <div class="progress-container">
                <div class="progress-bar-container" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
                <div class="progress-text">
                    <span id="progress-text">0% completado</span>
                    <span id="progress-count">0/5</span>
                </div>
            </div>
        </div>

        <div class="controls">
            <div class="search-container">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="search-input" placeholder="Buscar concepto o día..." oninput="filtrarDias()">
            </div>
            
            <select id="month-filter" onchange="filtrarDias()">
                <option value="todos">Todos los Meses</option>
                <option value="1">Mes 1: Fundamentos y React</option>
                <option value="2">Mes 2: Node, Auth & MongoDB</option>
                <option value="3">Mes 3: TS, Next.js & Postgres</option>
                <option value="4">Mes 4: DevOps & Testing</option>
                <option value="5">Mes 5: Proyecto & Empleo</option>
            </select>
            
            <div class="btn-group">
                <button class="btn btn-primary" onclick="exportarPDF()">
                    <i class="fas fa-file-pdf"></i>
                    Exportar PDF
                </button>
                <button class="btn btn-secondary" onclick="resetProgress()">
                    <i class="fas fa-redo"></i>
                    Reiniciar
                </button>
            </div>
        </div>

        <ul class="day-list" id="day-list" role="list"></ul>
    </aside>

    <!-- Main Content -->
    <main id="main-content" role="main">
        <div class="content-card" id="detail-card">
            <div style="text-align: center; padding: 60px 20px;">
                <i class="fas fa-book-open" style="font-size: 3rem; color: var(--accent); margin-bottom: 20px;"></i>
                <h2 style="color: var(--text-muted); margin-bottom: 15px;">¡Bienvenido al Curso!</h2>
                <p style="color: var(--text-muted);">Selecciona un día en la lista de la izquierda para comenzar a estudiar.</p>
            </div>
        </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script>
        // Base de Datos de Lecciones
        const cursoData = [
            {
                dia: 1,
                mes: 1,
                titulo: "Entorno de Desarrollo y Primer Script",
                concepto: "Node.js es un entorno de ejecución que permite correr JavaScript en el servidor o terminal. VS Code es el editor de código e instalamos Git para versionado.",
                codigo: '// dia1.js\nconsole.log("Hola, mundo");\n\n// Ejecución en terminal:\n// node dia1.js',
                ejercicio: "Crea una carpeta 'curso-web', inicializa un archivo 'dia1.js', escribe una función que imprima tu nombre y ejecuta el comando 'node dia1.js' en la terminal.",
                pregunta: "¿Qué diferencia hay entre ejecutar JavaScript en la consola del navegador y en Node.js?",
                opciones: [
                    "Node.js no maneja eventos ni código asíncrono.",
                    "Node.js no tiene acceso al DOM (document/window) del navegador.",
                    "El navegador ejecuta código de forma más lenta que Node.js."
                ],
                correcta: 1,
                explicacion: "Correcto: Node.js se ejecuta fuera del navegador, por lo que no existe el árbol DOM ('document' o 'window')."
            },
            {
                dia: 2,
                mes: 1,
                titulo: "Variables, Tipos de Datos y Operadores",
                concepto: "'const' define constantes y 'let' variables mutables. Evita 'var'. Las template literals (`${var}`) facilitan la concatenación de texto.",
                codigo: 'const nombre = "Ana";\nlet edad = 25;\nconsole.log(`${nombre} estudia JS y tiene ${edad} años`);',
                ejercicio: "Declara tu nombre, tu año de nacimiento y el año actual. Calcula tu edad mediante una resta e imprímela con template literals.",
                pregunta: "¿Qué sucede si intentas reasignar un valor a una variable declarada con 'const'?",
                opciones: [
                    "Se cambia el valor sin problemas.",
                    "Lanza un error de tipo TypeError en la consola.",
                    "La variable se convierte en undefined."
                ],
                correcta: 1,
                explicacion: "Correcto: Reasignar una constante arroja 'TypeError: Assignment to constant variable'."
            },
            {
                dia: 3,
                mes: 1,
                titulo: "Condicionales y Toma de Decisiones",
                concepto: "Estructuras 'if/else' y 'switch' para controlar el flujo del programa basándose en expresiones booleanas.",
                codigo: 'const edad = 20;\nif (edad >= 18) {\n  console.log("Mayor");\n} else {\n  console.log("Menor");\n}\n\n// Operador Ternario\nconst acceso = edad >= 18 ? "Permitido" : "Denegado";',
                ejercicio: "Crea un script que evalúe la nota de un examen (0 a 10) e imprima 'Suspenso', 'Aprobado', 'Notable' o 'Sobresaliente'.",
                pregunta: "¿En qué casos conviene usar 'switch' en lugar de múltiples 'if...else'?",
                opciones: [
                    "Cuando evaluamos rangos complejos como (x > 10 && x < 20).",
                    "Cuando comparamos una misma variable contra múltiples valores exactos.",
                    "Siempre, 'switch' es más rápido en todos los escenarios."
                ],
                correcta: 1,
                explicacion: "Correcto: 'switch' ofrece mejor legibilidad al comparar un único valor o variable frente a múltiples opciones exactas."
            },
            {
                dia: 4,
                mes: 1,
                titulo: "Bucles e Iteración",
                concepto: "'for...of' sirve para recorrer elementos de arrays; 'for...in' recorre las claves de un objeto.",
                codigo: 'const items = ["Laptop", "Teclado", "Mouse"];\nfor (const item of items) {\n  console.log(item);\n}',
                ejercicio: "Escribe un bucle 'for' que imprima únicamente los números pares comprendidos entre el 1 y el 30.",
                pregunta: "¿Cuál es la diferencia fundamental entre 'for...of' y 'for...in'?",
                opciones: [
                    "'for...of' itera sobre los VALORES; 'for...in' itera sobre las CLAVES/ÍNDICES.",
                    "'for...in' es para arrays y 'for...of' es solo para cadenas de texto.",
                    "Son idénticos y se pueden intercambiar en cualquier contexto."
                ],
                correcta: 0,
                explicacion: "Correcto: 'for...of' obtiene el elemento directamente, mientras que 'for...in' obtiene la propiedad o índice."
            },
            {
                dia: 5,
                mes: 1,
                titulo: "Funciones y Closures",
                concepto: "Las arrow functions () => {} simplifican la sintaxis. Un closure es una función que recuerda las variables de su ámbito léxico externo.",
                codigo: 'const sumar = (a, b) => a + b;\n\n// Closure\nfunction crearContador() {\n  let cuenta = 0;\n  return () => ++cuenta;\n}\nconst contador = crearContador();\nconsole.log(contador()); // 1',
                ejercicio: "Crea una función reutilizable que calcule el precio final de un producto aplicando un porcentaje de descuento y un impuesto (IVA).",
                pregunta: "¿Qué caracteriza principalmente a un closure en JavaScript?",
                opciones: [
                    "Es una función que se ejecuta de forma asíncrona.",
                    "Es una función que retiene acceso a variables de su entorno superior aun cuando éste ya finalizó.",
                    "Es una función que no acepta parámetros de entrada."
                ],
                correcta: 1,
                explicacion: "Correcto: Permite mantener estado privado aislando variables dentro de un alcance cerrado."
            }
        ];

        // Estado
        let estadoCompletados = JSON.parse(localStorage.getItem('curso_completados')) || {};
        let diaActual = 1;
        let temaOscuro = localStorage.getItem('theme') !== 'light';

        // Inicialización
        document.addEventListener('DOMContentLoaded', () => {
            aplicarTema();
            renderizarLista();
            cargarDia(1);
            actualizarProgreso();
        });

        function aplicarTema() {
            if (!temaOscuro) {
                document.body.classList.add('light-mode');
                document.getElementById('theme-icon').classList.replace('fa-moon', 'fa-sun');
            }
        }

        function toggleTheme() {
            temaOscuro = !temaOscuro;
            localStorage.setItem('theme', temaOscuro ? 'dark' : 'light');
            document.body.classList.toggle('light-mode');
            const icon = document.getElementById('theme-icon');
            icon.classList.toggle('fa-moon');
            icon.classList.toggle('fa-sun');
            showToast('Tema cambiado', 'success');
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type}`;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function renderizarLista() {
            const listEl = document.getElementById('day-list');
            listEl.innerHTML = '';
            const busqueda = document.getElementById('search-input').value.toLowerCase();
            const filtroMes = document.getElementById('month-filter').value;

            cursoData.forEach(item => {
                const coincideBusqueda = item.titulo.toLowerCase().includes(busqueda) || 
                                       item.concepto.toLowerCase().includes(busqueda) ||
                                       item.dia.toString().includes(busqueda);
                const coincideMes = filtroMes === 'todos' || item.mes.toString() === filtroMes;

                if (coincideBusqueda && coincideMes) {
                    const li = document.createElement('li');
                    li.className = `day-item ${item.dia === diaActual ? 'active' : ''} ${estadoCompletados[item.dia] ? 'completed' : ''}`;
                    li.setAttribute('role', 'listitem');
                    li.onclick = () => cargarDia(item.dia);
                    li.innerHTML = `
                        <div class="day-info">
                            <div class="day-number">Día ${item.dia}</div>
                            <div class="day-title">${item.titulo}</div>
                        </div>
                        <input type="checkbox" class="checkbox" ${estadoCompletados[item.dia] ? 'checked' : ''} onclick="e.stopPropagation(); toggleCompletado(${item.dia})">
                    `;
                    listEl.appendChild(li);
                }
            });
        }

        function cargarDia(numeroDia) {
            diaActual = numeroDia;
            const data = cursoData.find(d => d.dia === numeroDia);
            const card = document.getElementById('detail-card');

            if (!data) return;

            card.innerHTML = `
                <div class="day-header">
                    <h2 class="day-title"><i class="fas fa-calendar-day"></i> Día ${data.dia} · ${data.titulo}</h2>
                    <label class="checkbox-container">
                        <input type="checkbox" id="check-completado" ${estadoCompletados[data.dia] ? 'checked' : ''} onchange="toggleCompletado(${data.dia})">
                        <span>Marcar como Completado</span>
                    </label>
                </div>

                <div class="section-title"><i class="fas fa-lightbulb"></i> Concepto Teórico</div>
                <div class="concept-box"><p>${data.concepto}</p></div>

                <div class="section-title"><i class="fas fa-code"></i> Ejemplo de Código</div>
                <div class="code-container">
                    <button class="copy-btn" onclick="copiarCodigo('${data.codigo.replace(/'/g, "\\'")}')"><i class="fas fa-copy"></i> Copiar</button>
                    <pre><code>${data.codigo}</code></pre>
                </div>

                <div class="section-title"><i class="fas fa-tasks"></i> Ejercicio Práctico</div>
                <div class="exercise-box"><p>${data.ejercicio}</p></div>

                <div class="section-title"><i class="fas fa-question-circle"></i> Comprobación de Aprendizaje</div>
                <div class="quiz-container">
                    <p><strong>${data.pregunta}</strong></p>
                    <div>
                        ${data.opciones.map((op, idx) => `<div class="quiz-option" onclick="seleccionarOpcion(${data.dia}, ${idx}, ${data.correcta})" data-option="${idx}">${op}</div>`).join('')}
                    </div>
                    <div class="feedback" id="feedback-${data.dia}"></div>
                </div>
            `;

            const seleccionada = localStorage.getItem(`opcion_seleccionada_${data.dia}`);
            if (seleccionada) document.querySelector(`[data-option="${seleccionada}"]`).classList.add('selected');

            renderizarLista();
        }

        function copiarCodigo(codigo) {
            navigator.clipboard.writeText(codigo).then(() => showToast('Código copiado', 'success'));
        }

        function seleccionarOpcion(numeroDia, seleccionada, correcta) {
            document.querySelectorAll(`[data-option]`).forEach(opt => {
                opt.classList.remove('selected', 'correct', 'incorrect');
            });
            const opcionElemento = document.querySelector(`[data-option="${seleccionada}"]`);
            opcionElemento.classList.add('selected');
            localStorage.setItem(`opcion_seleccionada_${numeroDia}`, seleccionada);

            const feedback = document.getElementById(`feedback-${numeroDia}`);
            const data = cursoData.find(d => d.dia === numeroDia);

            if (seleccionada === correcta) {
                feedback.className = "feedback correct";
                feedback.innerHTML = `<i class="fas fa-check-circle"></i> ¡Excelente! ${data.explicacion}`;
                if (!estadoCompletados[numeroDia]) {
                    toggleCompletado(numeroDia);
                    document.getElementById('check-completado').checked = true;
                    showToast('¡Lección completada!', 'success');
                }
            } else {
                feedback.className = "feedback incorrect";
                feedback.innerHTML = `<i class="fas fa-times-circle"></i> Incorrecto. ${data.explicacion}`;
                document.querySelector(`[data-option="${correcta}"]`).classList.add('correct');
            }
        }

        function toggleCompletado(numeroDia) {
            estadoCompletados[numeroDia] = !estadoCompletados[numeroDia];
            localStorage.setItem('curso_completados', JSON.stringify(estadoCompletados));
            renderizarLista();
            actualizarProgreso();
        }

        function actualizarProgreso() {
            const total = cursoData.length;
            const completados = Object.values(estadoCompletados).filter(Boolean).length;
            const porcentaje = Math.round((completados / total) * 100);
            document.getElementById('progress-bar').style.width = porcentaje + '%';
            document.getElementById('progress-text').textContent = `${porcentaje}% completado`;
            document.getElementById('progress-count').textContent = `${completados}/${total} días`;
            document.querySelector('.progress-bar-container').setAttribute('aria-valuenow', porcentaje);
        }

        function filtrarDias() {
            renderizarLista();
        }

        function resetProgress() {
            if (confirm('¿Reiniciar todo?')) {
                estadoCompletados = {};
                localStorage.removeItem('curso_completados');
                [1,2,3,4,5].forEach(i => localStorage.removeItem(`opcion_seleccionada_${i}`));
                renderizarLista();
                actualizarProgreso();
                cargarDia(1);
                showToast('Progreso reiniciado', 'success');
            }
        }

        function exportarPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.setFont("helvetica", "bold");
            doc.setFontSize(20);
            doc.text("Reporte de Avance: Curso Desarrollo Web", 14, 20);

            doc.setFontSize(12);
            doc.setFont("helvetica", "normal");
            const completados = Object.values(estadoCompletados).filter(Boolean).length;
            doc.text(`Fecha: ${new Date().toLocaleDateString()}`, 14, 30);
            doc.text(`Progreso Global: ${completados} de ${cursoData.length} lecciones completadas.`, 14, 38);
            
            doc.setDrawColor(56, 189, 248);
            doc.rect(14, 45, 180, 10);
            doc.setFillColor(34, 197, 94);
            const progressWidth = (completados / cursoData.length) * 180;
            doc.rect(14, 45, progressWidth, 10, 'F');

            doc.setLineWidth(0.5);
            doc.setDrawColor(100);
            doc.line(14, 60, 196, 60);

            let y = 70;
            cursoData.forEach(item => {
                const estado = estadoCompletados[item.dia] ? "✓ COMPLETADO" : "○ PENDIENTE";
                doc.setFont("helvetica", "bold");
                doc.text(`Día ${item.dia}: ${item.titulo}`, 14, y);
                doc.setFont("helvetica", "normal");
                doc.text(`${estado}`, 14, y + 6);
                
                if (estadoCompletados[item.dia]) {
                    doc.setFontSize(10);
                    doc.text(`- ${item.concepto.substring(0, 50)}...`, 14, y + 12);
                    doc.setFontSize(12);
                }
                
                y += 20;
                if (y > 280) { doc.addPage(); y = 20; }
            });

            doc.save(`Reporte_Avance_Curso_${new Date().toISOString().split('T')[0]}.pdf`);
            showToast('PDF exportado', 'success');
        }
    </script>
</body>
</html>
